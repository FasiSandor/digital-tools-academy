name: Verify application (no deploy)
on:
  push:
    branches: [main, 'development/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Install browser for local no-deploy E2E
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test real Chromium browser against local Vite preview
        run: node tests/browser-e2e.mjs
